name: P0 checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, schema and catalog tests
        run: npm run check
      - name: Ensure fictional demo disclosure
        run: |
          grep -q 'Fictional stories' index.html
          grep -q 'noindex, nofollow' index.html
