name: Sync fictional stories from Notion

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish fictional profiles to main AND GitHub Pages? Default previews only.'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: career-library-notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
      NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      # Actions reruns keep their original GITHUB_SHA. Before importing,
      # deliberately load the current main rather than the old run commit.
      - name: Use newest main for retries
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Notion secrets are configured
        shell: bash
        run: |
          test -n "$NOTION_TOKEN" || { echo "Missing GitHub secret NOTION_TOKEN"; exit 1; }
          test -n "$NOTION_DATABASE_ID" || test -n "$NOTION_DATA_SOURCE_ID" || { echo "Set NOTION_DATABASE_ID or NOTION_DATA_SOURCE_ID"; exit 1; }
      - name: Check Notion connection and schema
        run: npm run notion:check
      - name: Import Published fictional profiles
        run: npm run sync
      - name: Run tests and build allowlisted public website
        run: npm run check
      - name: Show change summary
        shell: bash
        run: |
          git diff --stat -- data/profiles.json
          git status --short
      - name: Downloadable preview (fictional data only)
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v4
        with:
          name: notion-preview-catalog
          path: data/profiles.json
          retention-days: 2
      - name: Commit fictional public catalog to main
        if: ${{ inputs.publish }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/profiles.json
          if git diff --cached --quiet; then
            echo "No catalog changes to commit."
          else
            git commit -m "Sync fictional published Career Library profiles from Notion"
            # Preserve unrelated commits if main moved while this job was running.
            # If the same catalog was edited concurrently and cannot be rebased,
            # fail safely rather than force-pushing over newer data.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Package the static website for Pages
        if: ${{ inputs.publish }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
          include-hidden-files: true

  deploy:
    if: ${{ inputs.publish }}
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy public demo website
        id: deployment
        uses: actions/deploy-pages@v4
