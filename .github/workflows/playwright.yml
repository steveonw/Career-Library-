name: P1 Playwright browser QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/playwright.yml'
      - 'e2e/**'
      - 'playwright.config.mjs'
      - 'package.json'
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'lib/catalog.js'
      - 'data/profiles.json'
      - 'scripts/build-pages.mjs'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    name: Chromium and Firefox browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright test dependency
        run: npm install --no-audit --no-fund
      - name: Install Chromium, Firefox and system dependencies
        run: npx playwright install --with-deps chromium firefox
      - name: Validate snapshot and build static site
        run: npm run check
      - name: Test built website in real Chromium and Firefox
        run: npm run test:e2e
        env:
          CI: 'true'
          PLAYWRIGHT_REPORT_DIR: playwright-report/local
      - name: Test live GitHub Pages website in real Chromium and Firefox
        run: npm run test:e2e
        env:
          CI: 'true'
          PLAYWRIGHT_TEST_BASE_URL: https://steveonw.github.io/Career-Library-/
          PLAYWRIGHT_REPORT_DIR: playwright-report/live
      - name: Save Playwright HTML report, screenshots and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn
