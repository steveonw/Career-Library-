name: Deploy Career Library demo to Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pages.yml'
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'lib/catalog.js'
      - 'data/profiles.json'
      - 'scripts/build-pages.mjs'
      - 'package.json'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: career-library-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and package fictional career stories
        run: npm run check
      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages is enabled
        uses: actions/configure-pages@v5
      - name: Publish static career website
        id: deployment
        uses: actions/deploy-pages@v4
